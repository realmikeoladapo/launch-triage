name: False positive
description: Report a safe pattern that Launch Triage incorrectly flags.
title: "[False positive]: "
labels: [false-positive]
body:
  - type: markdown
    attributes:
      value: |
        Use only synthetic code. Never paste a live credential, private client source, customer name, or unsanitised report.
  - type: input
    id: version
    attributes:
      label: Launch Triage version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: "PAY-1"
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Minimal synthetic reproducer
      description: Include the smallest safe file and path that triggers the finding.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why this is safe
      description: Identify the control the scanner missed and how it can be recognised.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 24, macOS 15"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: This report contains only synthetic data and no live credential or private client source.
          required: true
