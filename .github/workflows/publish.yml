name: Publish to npm

# Releases publish only from an immutable GitHub release tag. The tag must
# exactly match package.json (v<version>) before npm authentication is used.

on:
  release:
    types: [published]

permissions:
  contents: read
  # Required for npm trusted publishing. This mints the short-lived OIDC token
  # and lets npm attach provenance linking the tarball to this workflow run.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or later. Pin the audited release
      # toolchain so a future npm major does not silently change this workflow.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@12.0.2
          npm --version

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v$VERSION"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Release tag $RELEASE_TAG does not match package version $VERSION (expected $EXPECTED_TAG)."
            exit 1
          fi
          echo "Release tag $RELEASE_TAG matches package version $VERSION"

      - name: Test before publishing
        run: npm test

      - name: Verify the version is not already published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already on npm. Bump the version."
            exit 1
          fi
          echo "Publishing $NAME@$VERSION"

      - name: Publish
        # No NPM_TOKEN. Authentication is the OIDC token from id-token: write,
        # and provenance is generated automatically by trusted publishing.
        run: npm publish --access public
