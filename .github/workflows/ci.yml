name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret rules grade against `git log --all`. A shallow clone
          # would make that check silently wrong.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      # Dogfood: the scanner must come up clean on its own source.
      - run: node scan.mjs . --fail-on critical
